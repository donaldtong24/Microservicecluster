apiVersion: v1
kind: Service
metadata:
  name: python-service
  labels:
    {{- include "python-microservice.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: python-app
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
