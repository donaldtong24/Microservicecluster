# Prod overrides: HA replica count, public LoadBalancer, defaults from values.yaml
# already cover resources/probes — override here only what actually differs.
replicaCount: 2

service:
  type: LoadBalancer

# Assumes kube-prometheus-stack (monitoring.tf) is already installed in
# this cluster, so the ServiceMonitor/PrometheusRule CRDs exist.
monitoring:
  enabled: true

# Populated by database.tf's kubernetes_secret.db_credentials.
env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: python-microservice-db
        key: DATABASE_URL
