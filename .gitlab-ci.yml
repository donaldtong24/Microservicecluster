# Parallel CI/CD path alongside .github/workflows/deploy.yml — same app,
# built/deployed via GitLab CI instead of GitHub Actions, deploying through
# the Helm chart (charts/python-microservice) rather than kubectl apply.
#
# Required GitLab CI/CD variables (Settings > CI/CD > Variables):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION,
#   ECR_REPOSITORY (e.g. my-python-service), EKS_CLUSTER_NAME

stages:
  - build
  - lint
  - deploy

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  script:
    - export ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

helm-lint:
  stage: lint
  image: alpine/helm:3.15.3
  script:
    - helm lint charts/python-microservice
    - helm template ci charts/python-microservice -f charts/python-microservice/values-prod.yaml > /dev/null

deploy:
  stage: deploy
  image:
    name: alpine/helm:3.15.3
    entrypoint: [""]
  before_script:
    - apk add --no-cache aws-cli
    - aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  script:
    - export ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - >
      helm upgrade --install python-microservice charts/python-microservice
      -f charts/python-microservice/values-prod.yaml
      --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY"
      --set image.tag="$IMAGE_TAG"
      --wait --timeout 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build
    - helm-lint
